# Single-origin SPA: static assets served from /usr/share/nginx/html, with /api/*
# reverse-proxied to the backend service. The compose network resolves `backend` to
# the backend container's internal IP.

upstream luminavault_backend {
    # Resolved at startup from the docker-compose service name.
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    # Must match the backend's Kestrel MaxRequestBodySize (50 MB) so glTF/ODS
    # uploads aren't truncated at the proxy with a 413.
    client_max_body_size 50m;

    # Long-running endpoints (ODS import, backup zip stream) can take a minute or
    # more; align the proxy timeouts with the backend's RequestTimeout policies
    # rather than nginx's stingy 60s default.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout 600s;

    # Healthcheck for `docker compose ps` / external uptime monitors.
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # All API traffic + downloadable photos/attachments/model files.
    location /api/ {
        proxy_pass http://luminavault_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Self-hosted tesseract.js OCR runtime: worker script, WASM core, and the English
    # language pack. `^~` so these win over the hashed-asset regex below, and an explicit
    # types block so `.wasm`/`.gz` get the right Content-Type and never fall through to the
    # SPA index. The `.gz` language pack is served raw (no gzip_static) because tesseract.js
    # decompresses it itself. Same-origin delivery is what lets the CSP drop all CDN hosts.
    location ^~ /tesseract/ {
        root /usr/share/nginx/html;
        types {
            application/wasm        wasm;
            application/javascript  js;
            application/octet-stream gz traineddata;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # Static assets get aggressive caching — Angular's production build emits
    # hashed filenames (`outputHashing: all` in angular.json), so cache busting
    # happens automatically on every release.
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|webp|gif|glb|gltf)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback: every other path serves index.html so the Angular router
    # can resolve deep links like /transactions on full page loads.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # The HTML shell must not be cached or the user gets a stale bundle
        # pointing at hashed assets that no longer exist after a deploy.
        add_header Cache-Control "no-store, no-cache, must-revalidate";

        # Hardening headers for the app shell. The JWT lives in localStorage, so the
        # CSP — which forbids inline/eval scripts — is the main line of defence turning a
        # stray XSS into a non-event. Every script/connect/worker origin is same-origin now
        # (tesseract.js is self-hosted under /tesseract/); the remaining allowances are real
        # runtime needs:
        #   - script-src 'wasm-unsafe-eval' : tesseract.js compiles its WASM OCR core
        #   - style-src 'unsafe-inline'     : Angular/PrimeNG inject component styles at runtime
        #   - img/connect/worker blob:      : protected media + the tesseract worker use blob URLs
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
