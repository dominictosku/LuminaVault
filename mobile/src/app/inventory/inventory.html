<p-toast />
<p-confirmdialog />
<div class="p-6 rounded-xl shadow space-y-4">
  <!-- Add Row -->
  <div class="flex gap-3 items-end">
    <p-button label="Add" icon="pi pi-plus" (onClick)="showDialog()" class="h-10"></p-button>
  </div>

  <!-- Table -->
  <p-table [value]="items" class="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr class="text-sm">
        <th>Name</th>
        <th>Quantity</th>
        <th>Date</th>
        <th>Price</th>
        <th>Category</th>
        <th class="w-24">Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-item let-i="rowIndex">
      <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.quantity }}</td>
        <td>{{ item.order_of_date }}</td>
        <td>{{ item.price }}</td>
        <td>{{ item.category.name }}</td>
        <td>
          <button pButton icon="pi pi-trash" class="p-button-text p-button-danger"
            (click)="confirm($event, i)"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="Add Entry" [modal]="true" [(visible)]="visible" [style]="{ width: '75rem' }">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

    <!-- Name -->
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium">Name</label>
      <input pInputText type="text" [(ngModel)]="newItem.name" class="w-full" />
    </div>

    <!-- Quantity -->
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium">Quantity</label>
      <input pInputText type="number" [(ngModel)]="newItem.quantity" class="w-full" />
    </div>

    <!-- Price -->
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium">Price</label>
      <input pInputText type="number" [(ngModel)]="newItem.price" class="w-full" />
    </div>

    <!-- Date of Order -->
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium">Date of Order</label>
      <p-datepicker [(ngModel)]="newItem.date_of_order" dateFormat="dd/mm/yy" placeholder="dd/mm/yyyy"
        pInputMask="99/99/9999" class="w-full" />
    </div>

    <!-- Category -->
    <div class="flex flex-col gap-1 md:col-span-2">
      <label class="text-sm font-medium">Category</label>
      <p-select [options]="categoryOptions" [(ngModel)]="newItem.category" optionLabel="name"
        placeholder="Select a category" class="w-full" />
    </div>

  </div>

  <!-- ACTIONS -->
  <div class="flex justify-end gap-2 mt-6">
    <p-button label="Cancel" severity="secondary" (click)="visible = false"></p-button>

    <p-button label="Save" (click)="addItem()"></p-button>
  </div>

</p-dialog>
